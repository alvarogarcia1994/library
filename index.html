<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Library</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    </head>

    <body>
        <header>
            <h1>Odin Library</h1>
            <button class="btn-primary">Add Book</button>
        </header>

        <main>
            <!-- Main block where JS will store the cards of the books-->
            <ul class="library-grid" aria-label="Library collection">
            
                <li class="book-card" data-id="example">
                    <h3 class="book-title">The Hobbit</h3>
                    <p class="book-author">by J.R.R. Tolkien</p>
                    <p class="book-pages">310 pages</p>
                    <div class="card-actions">
                        <button class="btn-status read">Read</button>
                        <button class="btn-delete">Delete</button>
                    </div>
                </li>

            </ul>
        </main>

        <!-- Modal -->
        <dialog class="modal-overlay">
            <h2>New Book</h2>
            <section class="modal-content">
                <form>
                    <div class="form-group">
                        <label for="title">Title: </label>
                        <input type="text" id="title" required autocomplete="off">
                    </div>
                
                    <div class="form-group">
                        <label for="author">Author: </label>
                        <input type="text" id="author" required autocomplete="off">
                    </div>
                    
                    <div class="form-group">
                        <label for="pages">Pages: </label>
                        <input type="number" id="pages" min="1" required>
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="is-read">
                        <label for="is-read">Read? </label>
                    </div>
                    
                    <div class="modal-actions">
                        <button type="button" class="btn-secondary">Cancel</button>
                        <button type="submit" class="btn-primary">Save</button>
                    </div>
                </form>
            </section>
        </dialog>

        <script src="js/library.js"></script>
    </body>

</html>
